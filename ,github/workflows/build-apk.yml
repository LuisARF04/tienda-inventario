name: Build APK
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
 
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Instalar dependencias
        run: npm install
 
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Agregar la plataforma Android
        run: npx cap add android
 
      - name: Sincronizar Capacitor
        run: npx cap sync android
 
      - name: Dar permiso de ejecución a gradlew
        run: chmod +x android/gradlew
 
      - name: Compilar el APK (debug)
        run: cd android && ./gradlew assembleDebug --no-daemon
 
      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tienda-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
 
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tienda v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
