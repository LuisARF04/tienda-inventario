<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>Mi Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E2128; --frame:#EFF0F2; --sheet:#FFFFFF; --tile:#FFFFFF; --ink:#1E2128; --muted:#717682; --line:#DDDFE4;
  --accent:#2F62E8; --accent-soft:#DEE6FB; --good:#1F7A5C; --good-soft:#DCEEE7; --bad:#AE3B3B; --bad-soft:#F6DFDF;
  --btn:#1E2128; --hero1:#1E2128; --hero2:#30343E; --shadow:none;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:var(--font);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --navy:#0B0C0F; --frame:#0B0C0F; --sheet:#15171C; --tile:#15171C; --ink:#E8EAEE; --muted:#8C909A; --line:#272A31;
  --accent:#5B86FF; --accent-soft:rgba(91,134,255,.16); --good:#3F9B7C; --good-soft:rgba(63,155,124,.14); --bad:#C0605F; --bad-soft:rgba(192,96,95,.14);
  --btn:#23262E; --hero1:#1A1C22; --hero2:#292D36; --shadow:none;
  color-scheme:dark;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--frame);font-family:var(--font);font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
h2,h3,p{margin:0}
.muted{color:var(--muted)}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--navy);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.18)}
.sheet{flex:1;min-height:0;overflow-y:auto;background:var(--sheet);padding:calc(env(safe-area-inset-top) + 22px) 20px calc(96px + env(safe-area-inset-bottom));scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:16px;right:92px;bottom:calc(14px + env(safe-area-inset-bottom));height:66px;display:flex;align-items:stretch;gap:2px;padding:6px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tb-ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:var(--accent-soft);transition:transform .25s cubic-bezier(.2,.8,.2,1),width .25s cubic-bezier(.2,.8,.2,1);z-index:0}
.tb{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px;color:var(--muted);font-size:10.5px;font-weight:600;transition:color .2s;text-align:center;line-height:1.15}
.tb.on{color:var(--accent)}
.tb.upd::after{content:'';position:absolute;top:7px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--sheet)}
.tb svg{transition:transform .2s}
.tb.on svg{stroke:var(--accent);animation:tbPop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes tbPop{from{transform:scale(.8)}to{transform:scale(1)}}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* encabezados */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.title{font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.hello{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.circ{width:42px;height:42px;border-radius:9px;background:var(--tile);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.circ.ghostw{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff}
.circ.ph0{border:0;visibility:hidden}
.circ.glass{background:var(--sheet);border:1px solid var(--line)}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -20px 18px;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 18px;border-radius:8px;background:var(--tile);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);transition:background .2s,border-color .2s}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sec h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sec button{font-size:13px;color:var(--muted);font-weight:600}

/* tarjeta principal */
.hero{border-radius:14px;padding:22px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2));box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.08)}
.hero .lab{font-size:12px;opacity:.65;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:38px;font-weight:600;letter-spacing:-.01em;margin:6px 0 16px;line-height:1.1}
.hero .big small{font-family:var(--font);font-size:14px;opacity:.6;font-weight:600;margin-left:6px;letter-spacing:0}
.mini2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}
.mini{background:rgba(255,255,255,.04);padding:12px 14px}
.mini .lab{display:flex;align-items:center;gap:6px}
.mini b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;margin-top:4px;font-weight:600}
.mini.gain b{color:#8EA9FF}
.prog{margin-top:16px}
.prog .tr{height:3px;border-radius:0;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:8px}
.prog .fl{height:100%;border-radius:0;background:var(--accent)}
.prog span{font-size:12px;opacity:.65;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--tile);padding:14px}
.stat .ico{width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.stat .ico svg{width:16px;height:16px}
.stat .lab{font-size:12px;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;margin-top:3px;font-weight:600}
.chart{background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:16px}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-weight:700}
.chart .hd b{font-family:var(--mono);font-weight:600;font-size:15px}
.bars{display:flex;gap:10px;height:110px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar{width:100%;border-radius:2px;background:var(--btn);opacity:.9}
.col.today .bar{background:var(--accent);opacity:1}
.bar.neg{background:var(--bad)}
.col span{font-size:11px;color:var(--muted);font-weight:700}
.scrollx{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.low{flex:none;width:130px;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.low .th{height:70px;margin-bottom:8px}
.low b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.low span{font-size:12px;font-weight:700;color:var(--bad)}

/* miniaturas */
.th{display:grid;place-items:center;border-radius:8px;background:var(--tile);border:1px solid var(--line);overflow:hidden;font-size:44px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.sm{width:52px;height:52px;font-size:26px;border-radius:8px;flex:none}

/* inventario */
.search{display:flex;align-items:center;gap:10px;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:0 16px;margin-bottom:16px;height:48px}
.search input{flex:1;border:0;background:none;outline:none;height:100%}
.search svg{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:block;width:100%}
.pcard .th{height:104px;margin-bottom:10px;border-radius:6px}
.pcard .pn{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .ps{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:3px 0 10px;font-weight:500}
.pcard .ps.low{color:var(--bad);width:auto;background:none;padding:0;border-radius:0}
.pcard .pp{display:flex;align-items:center;gap:4px}
.pcard .pp b{font-family:var(--mono);color:var(--ink);font-size:15px;font-weight:600}
.pcard .pp small{color:var(--muted);font-size:10.5px;font-weight:600;flex:1}
.plus{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center}
.plus svg{width:16px;height:16px;stroke-width:3}
.pcard.out{opacity:.55}
#lb{position:absolute;inset:0;z-index:65;display:none;align-items:center;justify-content:center;background:rgba(5,8,20,.92)}
#lb.on{display:flex}
#lb img{max-width:92%;max-height:92%;border-radius:20px;object-fit:contain}
.daysep{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.lotchip{padding:9px 14px;border-radius:7px;background:var(--tile);font-weight:600;font-size:13px;border:1px solid var(--line);text-align:left}
.lotchip.on{border-color:var(--accent);background:var(--accent-soft)}
.lotchip.off{opacity:.4}
.seg.sm{padding:3px;margin-top:8px}
.seg.sm button{padding:7px 4px;font-size:12px}
.fab{position:absolute;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));width:66px;height:66px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.3);z-index:10}
.fab.on{display:grid}
.fab svg{width:24px;height:24px;stroke-width:2.6}
.empty{text-align:center;padding:36px 10px;color:var(--muted)}
.empty .em{font-size:48px;margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

/* filas */
.row{display:flex;align-items:center;gap:12px;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.rm{flex:1;min-width:0}
.rn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.45;margin-top:2px}
.rr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rr b{font-family:var(--mono);color:var(--ink);font-weight:600;font-size:15px}
.pillx{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px}
.pillx.good{background:var(--good-soft);color:var(--good)}
.pillx.bad{background:var(--bad-soft);color:var(--bad)}
.sumbar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.sumbar div{background:var(--tile);padding:12px}
.sumbar span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.sumbar b{font-family:var(--mono);font-size:14.5px;font-weight:600}

/* más */
.profile{text-align:center;margin-bottom:22px}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(140deg,var(--navy),var(--hero2));color:#fff;font-size:34px;font-weight:700;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.idbox{display:flex;align-items:center;justify-content:space-between}
.idbox b{font-family:var(--mono);font-size:20px;letter-spacing:.04em;font-weight:600}
.profile h2{font-size:21px;font-weight:700}
.profile p{font-size:13px;margin-top:2px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;background:var(--tile);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:8px;font-weight:600;text-align:left}
.mrow svg:first-child{color:var(--ink)}
.mrow span{flex:1}
.mrow svg:last-child{color:var(--muted);width:18px;height:18px}
.mrow.red{color:var(--bad)}.mrow.red svg:first-child{color:var(--bad)}
.opt{background:var(--tile);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:8px}
.opt>div:first-child{font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.seg{display:flex;background:var(--frame);border:1px solid var(--line);border-radius:8px;padding:3px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--btn);color:#fff}

/* pantallas superpuestas */
#ov{position:absolute;inset:0;z-index:30;display:none}
#ov.on{display:block}
#ov.enter .screen{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--navy)}
.navhead{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px 16px;color:#fff}
.navhead h2{font-size:18px;font-weight:700}
.sheet.inset{border-radius:18px;margin:0 8px;padding-top:24px}
.bbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px calc(18px + env(safe-area-inset-bottom));color:#fff;border-top:1px solid rgba(255,255,255,.08)}
.bbar small{display:block;font-size:11px;opacity:.6;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bbar b{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.01em}
.bbar b em{font-style:normal;font-family:var(--font);font-size:13px;opacity:.6;margin-left:4px;font-weight:600}
.pill{background:#fff;color:var(--navy);font-weight:700;font-size:16px;border-radius:9px;padding:16px 34px;min-width:160px}
.pill.full{width:100%}
.pill:disabled{opacity:.4}
.dhero{position:relative;margin:calc(-1*(env(safe-area-inset-top) + 22px)) -20px 18px;padding:calc(env(safe-area-inset-top) + 14px) 18px 18px;height:calc(250px + env(safe-area-inset-top));background:var(--tile);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center}
.dhero .nav{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:18px;right:18px;display:flex;justify-content:space-between}
.dhero .pic{width:180px;height:180px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:96px;overflow:hidden;background:var(--sheet)}
.dhero .pic img{width:100%;height:100%;object-fit:cover}
.dname{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dname h2{font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.stepper{display:flex;align-items:center;gap:10px;flex:none}
.stepper button{width:30px;height:30px;border-radius:7px;background:var(--btn);color:#fff;display:grid;place-items:center}
.stepper button:disabled{opacity:.35}
.stepper button svg{width:16px;height:16px;stroke-width:3}
.stepper b{font-family:var(--mono);min-width:22px;text-align:center;font-size:16px;font-weight:600}
.h4{font-size:14px;font-weight:700;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vchips{display:flex;flex-wrap:wrap;gap:8px}
.vchip{padding:9px 14px;border-radius:7px;background:var(--tile);font-weight:600;font-size:14px;border:1px solid var(--line)}
.vchip i{font-style:normal;font-family:var(--mono);color:var(--muted);font-weight:600;margin-left:4px}
.vchip.on{border-color:var(--accent);background:var(--accent-soft)}
.vchip.off{opacity:.4;text-decoration:line-through}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.fin div{background:var(--tile);padding:12px}
.fin span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.fin b{font-family:var(--mono);font-size:14.5px;font-weight:600}
.desc{font-size:14px;line-height:1.55;color:var(--muted)}
.ghostbtn{width:100%;margin-top:16px;padding:14px;border-radius:9px;border:1px dashed var(--line);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}

/* formularios */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
.inp{width:100%;background:var(--tile);border:1px solid var(--line);border-radius:9px;padding:14px 16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:84px;resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo{width:100px;height:100px;border-radius:10px;background:var(--tile);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:600;text-align:center;overflow:hidden;flex:none}
.photo img{width:100%;height:100%;object-fit:cover}
.photorow{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.photorow p{font-size:13px;color:var(--muted);line-height:1.5}
.photorow button.lnk{color:var(--bad);font-weight:600;font-size:13px;margin-top:4px}
.catgrid{display:flex;flex-wrap:wrap;gap:8px}
.mg{border-radius:9px;padding:12px 14px;font-size:14px;font-weight:600;background:var(--tile);border:1px solid var(--line);margin:-4px 0 18px;color:var(--muted)}
.mg b.g{color:var(--good)}.mg b.r{color:var(--bad)}.mg b.o{color:var(--accent)}
.selectwrap{position:relative;margin-bottom:16px}
.selectwrap select{width:100%;background:var(--tile);border:1px solid var(--line);border-radius:9px;padding:14px 40px 14px 16px;font-weight:600;font-size:14px;color:var(--ink);appearance:none;-webkit-appearance:none}
.selectwrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(90deg);pointer-events:none;color:var(--muted)}
.vrow{display:grid;grid-template-columns:1.25fr 1fr .7fr 34px;gap:8px;margin-bottom:8px;align-items:center}
.vrow .inp{padding:12px}
.vrow button{width:34px;height:34px;border-radius:8px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}
.vrow button svg{width:16px;height:16px}

/* modal inferior */
#sh{position:absolute;inset:0;z-index:50;display:none}
#sh.on{display:block}
#sh .bd{position:absolute;inset:0;background:rgba(5,8,20,.55)}
#sh .panel{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:26px 22px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease;max-height:88%;overflow-y:auto}
#sh h3{font-size:19px;font-weight:700;margin-bottom:6px}
#sh .panel>p{margin-bottom:18px;line-height:1.5}
.btnrow{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:15px;border-radius:9px;background:var(--btn);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:var(--tile);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.full{width:100%;display:block}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted);font-weight:600}.kv b{font-family:var(--mono);font-weight:600}
#toast{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--sheet);padding:12px 20px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;white-space:nowrap;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* recorte de foto */
#crop{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;background:rgba(5,8,20,.94);color:#fff}
#crop.on{display:flex}
.cropbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;flex:none}
.cropbar button{font-size:14px;font-weight:700;color:rgba(255,255,255,.75)}
.cropbar button[data-act="cropok"]{color:var(--accent)}
.cropbar span{font-size:13px;font-weight:700;opacity:.6}
.cropstage{flex:1;display:grid;place-items:center;padding:10px}
.cropbox{width:260px;height:260px;border-radius:26px;overflow:hidden;position:relative;background:#000;touch-action:none}
.cropbox img{position:absolute;top:0;left:0;transform-origin:0 0;max-width:none;user-select:none;pointer-events:none}
.cropmask{position:absolute;inset:0;border-radius:26px;box-shadow:0 0 0 2000px rgba(5,8,20,.94);pointer-events:none}
.cropzoom{display:flex;align-items:center;gap:12px;padding:6px 26px calc(26px + env(safe-area-inset-bottom));flex:none}
.cropzoom svg{width:17px;height:17px;color:rgba(255,255,255,.6);flex:none}
.cropzoom input{flex:1;accent-color:var(--accent)}

/* bienvenida */
#onb{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;background:var(--navy)}
#onb.on{display:flex}
.onbtop{flex:1.15;background:var(--sheet);border-radius:0 0 36px 36px;position:relative;overflow:hidden;display:grid;place-items:center}
.onbtop .big{font-size:150px;filter:drop-shadow(0 20px 20px rgba(0,0,0,.18));animation:float 4s ease-in-out infinite}
.onbtop .f{position:absolute;font-size:52px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.15));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.dots i{width:22px;height:5px;border-radius:9px;background:#fff}.dots i+i{width:5px;opacity:.4}
.onbbot{padding:26px 24px calc(26px + env(safe-area-inset-bottom));color:#fff;text-align:center}
.onbbot h2{font-size:24px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em}
.onbbot p{font-size:14px;opacity:.7;line-height:1.55;margin-bottom:20px}
.onbbot input{width:100%;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;padding:16px 22px;font-size:15px;outline:none;margin-bottom:12px;text-align:center}
.onbbot input::placeholder{color:rgba(255,255,255,.5)}
.onbbot .lnk{margin-top:14px;font-size:14px;font-weight:600;opacity:.75;color:#fff}
.onbphoto{width:92px;height:92px;border-radius:50%;margin:0 auto 18px;background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;overflow:hidden}
.onbphoto.has{border-style:solid;border-color:transparent}
.onbphoto img{width:100%;height:100%;object-fit:cover}
.onbphoto svg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

};

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const num=s=>parseFloat(String(s).replace(',','.'))||0;
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=n=>(n>0?'+':'')+fmt(n);

const blank=()=>({v:1,onboarded:false,store:'Mi tienda',storeImg:'',storeId:'',theme:'auto',cur:'CUP',products:[],sales:[]});
const formatId=id=>id?id.slice(0,4)+' '+id.slice(4):'';

/* ---------- varias tiendas (cada una con sus datos aparte) ---------- */
const REG_KEY='inv_stores_v1',ACTIVE_KEY='inv_active_store';
const storageKeyFor=id=>id==='default'?KEY:KEY+'__'+id;
function loadRegistry(){try{const r=JSON.parse(localStorage.getItem(REG_KEY));if(Array.isArray(r)&&r.length)return r}catch(e){}return [{id:'default',name:'Mi tienda'}]}
function saveRegistry(r){try{localStorage.setItem(REG_KEY,JSON.stringify(r))}catch(e){}}
let registry=loadRegistry();
let activeId=localStorage.getItem(ACTIVE_KEY)||'default';
if(!registry.some(r=>r.id===activeId))activeId=registry[0].id;

function load(id){try{const s=JSON.parse(localStorage.getItem(storageKeyFor(id)));if(s&&Array.isArray(s.products))return Object.assign(blank(),s)}catch(e){}return blank()}
let state=load(activeId);
migrateLots();
(()=>{const entry=registry.find(r=>r.id===activeId);if(entry&&state.store)entry.name=state.store;else if(entry)entry.name=entry.name||state.store;saveRegistry(registry)})();
function save(){try{localStorage.setItem(storageKeyFor(activeId),JSON.stringify(state))}catch(e){toast('No hay espacio. Usa fotos más pequeñas o exporta un respaldo')}}
function renameActiveStore(n){const entry=registry.find(r=>r.id===activeId);if(entry){entry.name=n;saveRegistry(registry)}}
function switchToStore(id){
  if(id===activeId){closeSheet();return}
  activeId=id;localStorage.setItem(ACTIVE_KEY,id);
  state=load(id);migrateLots();ui.tab='home';closeSheet();applyTheme();render();
}
function createStore(name){
  const id=uid();registry.push({id,name});saveRegistry(registry);
  activeId=id;localStorage.setItem(ACTIVE_KEY,id);
  state=blank();state.store=name;state.onboarded=true;save();

}
const ui={tab:'home',period:'all',speriod:'all',cat:'Todos',sup:'Todas',q:'',search:false,onlyAvail:false,sSearch:false,sq:'',sFrom:'',sTo:''};

/* ---------- lotes de compra (mismo producto, distintos precios de compra) ---------- */
function migrateLots(){
  state.products.forEach(p=>{
    (p.variants||[]).forEach(v=>{
      if(!Array.isArray(v.lots)||!v.lots.length){v.lots=[{id:uid(),cost:p.cost||0,qty:v.qty||0}];return}
      const lotSum=sum(v.lots,l=>l.qty);
      if(lotSum!==v.qty){
        const diff=v.qty-lotSum;
        if(diff>0)v.lots.push({id:uid(),cost:p.cost||0,qty:diff});
        else{let rem=-diff;for(let i=v.lots.length-1;i>=0&&rem>0;i--){const take=Math.min(v.lots[i].qty,rem);v.lots[i].qty-=take;rem-=take}v.lots=v.lots.filter(l=>l.qty>0);if(!v.lots.length)v.lots=[{id:uid(),cost:p.cost||0,qty:0}]}
      }
    });
  });
}
function addLot(v,qty,cost){
  const ex=v.lots.find(l=>Math.abs(l.cost-cost)<0.005);
  if(ex)ex.qty+=qty;else v.lots.push({id:uid(),cost,qty});
  v.qty=sum(v.lots,l=>l.qty);
}
function defaultLot(v){if(!v)return null;return v.lots.find(l=>l.qty>0)||v.lots[0]||null}
async function fetchRate(){
  try{
    const r=await fetch(`https://raw.githubusercontent.com/LuisARF04/mis-finanzas/main/rates.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw 0;const j=await r.json();if(!j.usd)throw 0;return j.usd;
  }catch(e){return null}
}
function inPeriod(iso,p){const t=new Date(iso).getTime(),n=new Date(),sod=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(p==='today')return t>=sod;const map={'7':6,'15':14,'30':29};if(map[p]!==undefined)return t>=sod-map[p]*864e5;return true}
function fdate(iso){const d=new Date(iso),n=new Date();const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===n.toDateString())return 'Hoy, '+hm;return d.getDate()+' '+MESES[d.getMonth()]+', '+hm}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),m.length>40?4200:2200)}

/* ---------- datos de ejemplo ---------- */
function demo(){
  const mk=(name,supplier,cat,cost,price,desc,vs)=>({id:uid(),name,supplier,cat,cost,price,desc,img:'',variants:vs.map(([size,color,qty])=>({id:uid(),size,color,qty})),created:Date.now()});
  const ps=[
    mk('Camiseta oversize','Mercado Central','Ropa y Calzado',900,1600,'Algodón grueso, corte holgado.',[['M','Negro',9],['L','Negro',7],['M','Blanco',8]]),
    mk('Tenis running','Importadora Habana','Ropa y Calzado',7000,10500,'Suela amortiguada, uso diario.',[['40','Blanco',5],['42','Negro',6],['43','Negro',3]]),
    mk('Mochila urbana','Importadora Habana','Accesorios',2800,4500,'Compartimento para laptop de 15".',[['Único','Gris',9]]),
    mk('Auriculares Bluetooth','Tienda TecnoPlus','Electrónica',2000,3500,'Hasta 20 h de batería.',[['','Negro',10],['','Blanco',4]]),
    mk('Perfume 100 ml','Tienda TecnoPlus','Belleza',3200,5200,'Fragancia fresca cítrica.',[['100 ml','',4]]),
    mk('Gorra visera plana','Mercado Central','Accesorios',500,900,'Ajustable, varios colores.',[['Único','Azul',8],['Único','Rojo',6]])
  ];
  state.products=ps;state.sales=[];
  const add=(pi,vi,q,days,price)=>{const p=ps[pi],v=p.variants[vi];q=Math.min(q,v.qty);if(q<1)return;v.qty-=q;
    const d=new Date(Date.now()-days*864e5-Math.random()*5*36e5);
    state.sales.push({id:uid(),pid:p.id,vid:v.id,name:p.name,variant:vlabel(v),qty:q,cost:p.cost,price:price||p.price,date:d.toISOString()})};
  [[0,0,2,6],[1,1,1,6],[3,0,2,5],[2,0,1,5],[0,2,3,4],[5,0,2,4],[1,0,1,3],[4,0,1,3],[0,1,2,2],[3,1,1,2],[2,0,1,1],[1,2,1,1],[0,0,1,0],[3,0,2,0],[5,1,1,0,800]].forEach(a=>add(...a));
  state.sales.sort((a,b)=>b.date.localeCompare(a.date));
}

function render(){

function positionTabInd(prevStyle){
  const nav=$('#tabs'),ind=$('#tbInd'),on=nav&&nav.querySelector('.tb.on');
  if(!nav||!ind||!on)return;
  if(prevStyle&&prevStyle.w){
    ind.style.transition='none';
    ind.style.width=prevStyle.w;
    ind.style.transform=prevStyle.t;
    ind.offsetWidth; // forzar reflow
    ind.style.transition='';
  }
  ind.style.width=on.offsetWidth+'px';
  ind.style.transform='translateX('+on.offsetLeft+'px)';
}

const periodChips=(cur,act)=>`<div class="chips">${PERIODS.map(([k,l])=>`<button class="chip ${cur===k?'on':''}" data-act="${act}" data-id="${k}">${l}</button>`).join('')}</div>`;

function homeHTML(){
  const S=state.sales.filter(s=>inPeriod(s.date,ui.period));
  const rev=sum(S,s=>s.qty*s.price),prof=rev-sum(S,s=>s.qty*s.cost),units=sum(S,s=>s.qty);
  const revAll=sum(state.sales,s=>s.qty*s.price),costAll=sum(state.sales,s=>s.qty*s.cost);
  const stockUnits=sum(state.products,stock),stockCost=sum(state.products,p=>p.cost*stock(p)),stockVal=sum(state.products,p=>p.price*stock(p));
  const invested=costAll+stockCost,pct=invested?Math.min(100,revAll/invested*100):0;
  const recent=state.sales.slice(0,3);
  return `<div class="top"><div class="title" style="flex:1;text-align:left">Tienda: ${esc(state.store)}</div><button class="circ" data-act="switchstore" aria-label="Cambiar de tienda">${ic('store')}</button></div>
    ${periodChips(ui.period,'period')}
    <div class="hero">
      <div class="lab">Dinero recaudado</div>
      <div class="big">${fmt(rev)}<small>${state.cur}</small></div>
      <div class="mini2">
        <div class="mini gain"><div class="lab">${ic('trend').replace('class="i"','class="i" style="width:15px;height:15px"')}Ganancia</div><b>${sgn(prof)}</b></div>
        <div class="mini"><div class="lab">Artículos vendidos</div><b>${units}</b></div>
      </div>
      <div class="prog"><div class="tr"><div class="fl" style="width:${pct}%"></div></div>
        <span>${invested?(pct>=100?'Ya recuperaste todo lo que invertiste':`Capital recuperado: ${Math.round(pct)}% de ${money(invested)}`):'Agrega productos para ver tu avance'}</span></div>
    </div>
    <div class="sec"><h3>Tu inventario</h3></div>
    <div class="stats">
      <div class="stat"><div class="ico">${ic('box')}</div><div class="lab">Unidades en stock</div><b>${stockUnits}</b></div>
      <div class="stat"><div class="ico">${ic('layers')}</div><div class="lab">Productos</div><b>${state.products.length}</b></div>
      <div class="stat"><div class="ico">${ic('coin')}</div><div class="lab">Invertido en stock</div><b>${money(stockCost)}</b></div>
      <div class="stat"><div class="ico">${ic('trend')}</div><div class="lab">Ganancia por vender</div><b>${sgn(stockVal-stockCost)}</b></div>
    </div>

function chartHTML(){
  const now=new Date(),days=[];
  for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i),s=d.getTime(),e=s+864e5;
    const pr=sum(state.sales.filter(x=>{const t=new Date(x.date).getTime();return t>=s&&t<e}),x=>x.qty*(x.price-x.cost));
    days.push({l:'DLMXJVS'[d.getDay()],pr,today:i===0})}
  const mx=Math.max(1,...days.map(d=>Math.abs(d.pr)));
  return `<div class="chart"><div class="hd"><span class="muted">Últimos 7 días</span><b>${sgn(sum(days,d=>d.pr))} ${state.cur}</b></div>
    <div class="bars">${days.map(d=>`<div class="col ${d.today?'today':''}"><div class="bar ${d.pr<0?'neg':''}" style="height:${Math.max(5,Math.abs(d.pr)/mx*80)}%"></div><span>${d.l}</span></div>`).join('')}</div></div>`;
}

function filtered(){

/* ---------- actualizaciones desde GitHub Releases ---------- */
const APP_VERSION='dev'; // al compilar, el workflow pone aquí la versión real (la misma de Releases)
const GH_REPO='LuisARF04/tienda-inventario';
const UPD={state:'idle',latest:null,url:null,msg:''};
const verParts=v=>String(v).split('.').map(n=>parseInt(n,10)||0);
function isNewer(a,b){const x=verParts(a),y=verParts(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0}return false}
function updText(){return{idle:'Busca si hay una versión nueva',checking:'Buscando…',latest:'Tienes la última versión',available:'Hay una versión nueva: '+UPD.latest,error:UPD.msg}[UPD.state]}
function updDot(){const b=document.querySelector('.tb[data-id="more"]');if(b)b.classList.toggle('upd',UPD.state==='available')}
async function checkUpdate(silent){
  UPD.state='checking';if(!silent&&ui.tab==='more')render();
  try{
    const r=await fetch(`https://api.github.com/repos/${GH_REPO}/releases/latest`,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error(r.status===404?'Todavía no hay versiones publicadas':'GitHub respondió con error '+r.status);
    const d=await r.json(),m=/(\d+(?:\.\d+)+)/.exec(d.tag_name||d.name||''),apk=(d.assets||[]).find(a=>/\.apk$/i.test(a.name));
    UPD.latest=m?m[1]:null;UPD.url=apk?apk.browser_download_url:d.html_url;
    UPD.state=UPD.latest&&APP_VERSION!=='dev'&&isNewer(UPD.latest,APP_VERSION)?'available':'latest';
  }catch(e){UPD.state=silent?'idle':'error';UPD.msg=e instanceof TypeError?'Sin conexión a internet':e.message}
  if(silent&&UPD.state==='available')toast(`Versión ${UPD.latest} disponible en Configuración`);
  if(!silent||ui.tab==='more')render();else updDot();
}
function downloadUpdate(){
  const Br=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Browser;
  try{if(Br)Br.open({url:UPD.url});else window.open(UPD.url,'_blank')}catch(e){location.href=UPD.url}
  toast('Cuando termine la descarga, toca el archivo para instalar');
}

const ACT={
  fabmenu:()=>openSheet(`<h3 style="margin-bottom:16px">¿Qué quieres agregar?</h3>
    <button class="mrow" data-act="newsale">${ic('receipt')}<span>Nueva venta</span>${ic('chev')}</button>
    <button class="mrow" data-act="fabnewprod">${ic('box')}<span>Nuevo producto</span>${ic('chev')}</button>`),
  fabnewprod:()=>{closeSheet();ACT.new()},
  newsale:()=>{
    if(!state.products.some(p=>stock(p)>0)){closeSheet();return toast('No hay productos con stock para vender')}
    openSheet(`<h3>Nueva venta</h3><p class="muted">Elige el producto que vendiste.</p>
      <div class="search">${ic('search')}<input id="saleq" placeholder="Buscar producto" autocomplete="off"></div>
      <div id="salepick">${salePickHTML('')}</div>`)},
  salepick:id=>{closeSheet();ACT.open(id)},
  checkupd:()=>checkUpdate(false),
  dlupd:()=>downloadUpdate(),
  tab:id=>{ui.tab=id;render();$('#view').scrollTop=0},
  period:id=>{ui.period=id;render()},
  speriod:id=>{ui.speriod=id;render()},
  cat:id=>{ui.cat=id;render()},
  sup:id=>{ui.sup=id;render()},
  search:()=>{ui.search=!ui.search;if(!ui.search)ui.q='';render();if(ui.search)$('#q').focus()},
  ssearch:()=>{ui.sSearch=!ui.sSearch;if(!ui.sSearch){ui.sq='';ui.sFrom='';ui.sTo=''}render();if(ui.sSearch){const el=$('#sq');if(el)el.focus()}},
  open:id=>{const p=prod(id);if(!p)return;const v=p.variants.find(v=>v.qty>0)||p.variants[0];ov={type:'detail',id,vid:v&&v.id,qty:1,price:String(p.price)};openOv()},
  close:()=>closeOv(),
  new:()=>{draft=blankDraft();ov={type:'form'};openOv();margin()},
  edit:()=>{const p=prod(ov.id);draft=JSON.parse(JSON.stringify(p));draft.cost=String(p.cost);draft.costCurr=state.cur;draft.price=String(p.price);draft.variants.forEach(v=>v.qty=String(v.qty));ov={type:'form',id:p.id};renderOv();margin()},
  formback:()=>{if(ov.id){const p=prod(ov.id);draft=null;ov={type:'detail',id:p.id,vid:(p.variants.find(v=>v.qty>0)||p.variants[0]).id,qty:1,price:String(p.price)};renderOv()}else closeOv()},
  addvar:()=>{draft.variants.push({id:uid(),size:'',color:'',qty:''});renderOv();margin();const r=document.querySelectorAll('.vrow');r[r.length-1].querySelector('input').focus()},
  delvar:id=>{if(draft.variants.length>1){draft.variants.splice(+id,1);renderOv();margin()}else toast('Debe haber al menos una variante')},
  photo:()=>{photoTarget='product';$('#file').click()},
  rmphoto:()=>{draft.img='';renderOv();margin()},
  storephoto:()=>{photoTarget='store';$('#file').click()},
  rmstorephoto:()=>{state.storeImg='';save();ACT.editstore();render()},
  onbphoto:()=>{photoTarget='onboard';$('#file').click()},
  genid:async()=>{
    if(!navigator.onLine){toast('Necesitas conexión a internet para generar el ID');return}
    if(!sb){toast('Falta configurar la conexión con la base de datos');return}
    toast('Verificando disponibilidad del ID…');
    const ok=await ensureAuth();
    if(!ok){toast('No se pudo conectar: '+authError);return}
    for(let i=0;i<6;i++){
      const id=String(Math.floor(10000000+Math.random()*90000000));
      const {error}=await sb.from('stores').insert({id,name:state.store,currency:state.cur,owner_id:sbUserId});
      if(!error){state.storeId=id;save();render();toast('ID generado: '+formatId(id));return}
      if(error.code!=='23505'){toast('No se pudo generar el ID: '+error.message);return}
    }
    toast('No se pudo generar un ID disponible, intenta de nuevo');
  },
  regenid:()=>ask('¿Generar otro ID?','El ID anterior dejará de servir para esta tienda. Si ya lo usaste en tu app de finanzas, tendrás que actualizarlo allí también.','Generar otro',()=>ACT.genid(),true),
  copyid:()=>{
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(state.storeId).then(()=>toast('ID copiado')).catch(()=>toast('No se pudo copiar'));
    else toast('No se pudo copiar');
  },
  save:async()=>{
    const d=draft;if(!d.name.trim())return toast('Escribe el nombre del producto');
    if(num(d.price)<=0)return toast('Escribe el precio de venta');
    let cost=num(d.cost);
    if((d.costCurr||state.cur)!==state.cur){
      toast('Convirtiendo precio de compra…');
      const rate=await fetchRate();
      if(!rate){toast('No se pudo obtener la tasa de cambio para convertir. Verifica tu conexión e intenta de nuevo.');return}
      cost=state.cur==='CUP'?round2(cost*rate):round2(cost/rate);
    }
    const vs=d.variants.map(v=>{
      const qty=Math.max(0,parseInt(v.qty)||0);
      let lots=Array.isArray(v.lots)?v.lots.map(l=>({id:l.id||uid(),cost:l.cost,qty:l.qty})):[];
      const lotSum=sum(lots,l=>l.qty);
      if(qty!==lotSum){
        const diff=qty-lotSum;
        if(diff>0)lots.push({id:uid(),cost,qty:diff});
        else{let rem=-diff;for(let i=lots.length-1;i>=0&&rem>0;i--){const take=Math.min(lots[i].qty,rem);lots[i].qty-=take;rem-=take}lots=lots.filter(l=>l.qty>0)}
      }
      if(!lots.length)lots=[{id:uid(),cost,qty:0}];
      return {id:v.id,size:v.size.trim(),color:v.color.trim(),qty,lots};
    });
    const p={id:d.id||uid(),name:d.name.trim(),supplier:d.supplier.trim(),cat:d.cat,cost,price:num(d.price),desc:d.desc.trim(),img:d.img||'',variants:vs,created:d.created||Date.now()};
    const i=state.products.findIndex(x=>x.id===p.id);if(i>-1)state.products[i]=p;else state.products.unshift(p);
    save();
    if(d.id){draft=null;ov={type:'detail',id:p.id,vid:(vs.find(v=>v.qty>0)||vs[0]).id,qty:1,lotId:null,price:String(p.price)};renderOv();render()}else closeOv();
    toast(d.id?'Cambios guardados':'Producto agregado');
  },
  costcurr:id=>{draft.costCurr=id;renderOv();margin()},
  delprod:()=>ask('¿Eliminar producto?','Se quitará del inventario. Tus ventas anteriores se conservan en el historial.','Eliminar',()=>{state.products=state.products.filter(p=>p.id!==ov.id);save();closeOv();toast('Producto eliminado')},true),
  pickvar:id=>{ov.vid=id;ov.qty=1;ov.lotId=null;renderOv()},
  picklot:id=>{ov.lotId=id;ov.qty=1;renderOv()},
  onlyavail:()=>{ui.onlyAvail=!ui.onlyAvail;render()},
  zoomphoto:()=>{const p=prod(ov.id);if(!p||!p.img)return;$('#lb').innerHTML=`<img src="${p.img}" alt="">`;$('#lb').classList.add('on')},
  closelb:()=>{$('#lb').classList.remove('on');$('#lb').innerHTML=''},
  qminus:()=>{if(ov.qty>1){ov.qty--;renderOv();sellDom()}},
  qplus:()=>{const p=prod(ov.id),v=p.variants.find(x=>x.id===ov.vid),lot=v&&v.lots.find(l=>l.id===ov.lotId);if(lot&&ov.qty<lot.qty){ov.qty++;renderOv();sellDom()}},
  sell:()=>{
    const p=prod(ov.id),v=p.variants.find(x=>x.id===ov.vid),lot=v&&v.lots.find(l=>l.id===ov.lotId);
    if(!v||!lot||ov.qty<1||ov.qty>lot.qty)return toast('No hay suficiente stock en ese lote');
    const price=num(ov.price);if(price<=0)return toast('Escribe el precio de venta');
    lot.qty-=ov.qty;v.qty=sum(v.lots,l=>l.qty);
    // Fecha elegida (si es un día anterior a hoy se guarda ese día, a la hora actual)
    const sd=ov.sdate&&ov.sdate<todayYMD()?ov.sdate:null;let when=new Date();
    if(sd){const [y,m,d]=sd.split('-').map(Number);when=new Date(y,m-1,d,when.getHours(),when.getMinutes(),when.getSeconds())}
    const sale={id:uid(),pid:p.id,vid:v.id,lotId:lot.id,name:p.name,variant:vlabel(v),qty:ov.qty,cost:lot.cost,price,date:when.toISOString()};
    state.sales.unshift(sale);state.sales.sort((a,b)=>b.date.localeCompare(a.date));
    save();const sold=ov.qty,nv=p.variants.find(x=>x.qty>0);
    ov.vid=(nv||v).id;ov.lotId=null;ov.qty=1;renderOv();sellDom();toast(`Venta registrada: ${fmt(price*sold)} ${state.cur}${sd?' ('+sd.split('-').reverse().join('/')+')':''}`);
    pushSale(sale);
  },
  restock:()=>{const p=prod(ov.id);restockCurr=state.cur;
    openSheet(`<h3>Reabastecer</h3><p class="muted">Suma unidades al stock de ${esc(p.name)}. Si el precio de compra es distinto al de antes, se guarda como un lote nuevo (podrás elegir cuál vender).</p>
      <div class="field"><label>Variante</label><select class="inp" id="rs-v">${p.variants.map(v=>`<option value="${v.id}" ${v.id===ov.vid?'selected':''}>${esc(vlabel(v))} (hay ${v.qty})</option>`).join('')}</select></div>
      <div class="field"><label>Cantidad que llegó</label><input class="inp" id="rs-q" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label>Precio de compra de este lote</label><input class="inp" id="rs-c" inputmode="decimal" placeholder="${p.cost}">
        <div class="seg sm">${CURS.map(c=>`<button data-act="rscurr" data-id="${c}" class="${restockCurr===c?'on':''}">${c}</button>`).join('')}</div></div>
      <button class="btn full" data-act="dorestock">Agregar al inventario</button>`)},
  rscurr:id=>{restockCurr=id;ACT.restock()},
  dorestock:async()=>{const p=prod(ov.id),v=p.variants.find(x=>x.id===$('#rs-v').value),q=parseInt($('#rs-q').value)||0;
    if(q<1)return toast('Escribe la cantidad');
    let c=num($('#rs-c').value)||p.cost||0;
    if(restockCurr!==state.cur){
      toast('Convirtiendo precio de compra…');
      const rate=await fetchRate();
      if(!rate){toast('No se pudo obtener la tasa de cambio. Verifica tu conexión e intenta de nuevo.');return}
      c=state.cur==='CUP'?round2(c*rate):round2(c/rate);
    }
    addLot(v,q,c);p.cost=c;
    ov.vid=v.id;ov.lotId=null;save();closeSheet();renderOv();sellDom();toast('Stock actualizado')},
  opensale:id=>{const s=state.sales.find(x=>x.id===id);if(!s)return;const pr=s.qty*(s.price-s.cost);
    openSheet(`<h3>${esc(s.name)}</h3><p class="muted">${esc(s.variant)}, ${fdate(s.date)}</p>
      <div class="field"><label>Cantidad</label><input class="inp" id="es-q" inputmode="numeric" value="${s.qty}"></div>
      <div class="field"><label>Precio por unidad (${state.cur})</label><input class="inp" id="es-p" inputmode="decimal" value="${s.price}"></div>
      <div class="field"><label>Costo por unidad (${state.cur})</label><input class="inp" id="es-c" inputmode="decimal" value="${s.cost}"></div>
      <div class="kv"><span>Total cobrado</span><b id="es-tot">${money(s.qty*s.price)}</b></div>
      <div class="kv"><span>Ganancia</span><b id="es-prof" style="color:${pr>=0?'var(--good)':'var(--bad)'}">${sgn(pr)} ${state.cur}</b></div>
      <div class="btnrow" style="margin-top:18px"><button class="btn ghost" data-act="sheetclose">Cerrar</button><button class="btn" data-act="savesale" data-id="${s.id}">Guardar cambios</button></div>
      <button class="btn danger full" style="margin-top:10px" data-act="undosale" data-id="${s.id}">Devolver al stock</button>`)},
  savesale:id=>{const s=state.sales.find(x=>x.id===id);if(!s)return;
    const q=Math.max(1,parseInt($('#es-q').value)||1),pr=num($('#es-p').value),c=num($('#es-c').value);
    if(pr<=0)return toast('Escribe el precio por unidad');
    s.qty=q;s.price=pr;s.cost=c;save();closeSheet();render();toast('Venta actualizada. El stock no cambia: usa "Devolver al stock" si también necesitas ajustarlo.')},
  undosale:id=>{const s=state.sales.find(x=>x.id===id);if(!s)return;const p=prod(s.pid);
    if(p){let v=p.variants.find(x=>x.id===s.vid);
      if(v){if(!Array.isArray(v.lots))v.lots=[];let lot=v.lots.find(l=>l.id===s.lotId);
        if(!lot){lot={id:s.lotId||uid(),cost:s.cost,qty:0};v.lots.push(lot)}
        lot.qty+=s.qty;v.qty=sum(v.lots,l=>l.qty);
      }else p.variants.push({id:uid(),size:s.variant==='Único'?'':s.variant,color:'',qty:s.qty,lots:[{id:uid(),cost:s.cost,qty:s.qty}]})}
    state.sales=state.sales.filter(x=>x.id!==id);save();closeSheet();render();toast(p?'Venta anulada y stock restaurado':'Venta anulada');
    pullSale(id)},
  theme:id=>{state.theme=id;save();applyTheme();render()},
  cur:async id=>{
    if(id===state.cur)return;
    toast('Obteniendo la tasa de cambio para convertir…');
    const rate=await fetchRate();
    if(!rate){toast('No se pudo obtener la tasa de cambio (revisa tu conexión y que Wallet tenga la tasa publicada). No se cambió la moneda.');render();return}
    const factor=(state.cur==='CUP'&&id==='USD')?(1/rate):(state.cur==='USD'&&id==='CUP')?rate:1;
    if(factor!==1){
      state.products.forEach(p=>{
        p.cost=round2(p.cost*factor);p.price=round2(p.price*factor);
        (p.variants||[]).forEach(v=>(v.lots||[]).forEach(l=>l.cost=round2(l.cost*factor)));
      });
      state.sales.forEach(s=>{s.price=round2(s.price*factor);s.cost=round2(s.cost*factor)});
    }
    state.cur=id;save();render();syncStoreMeta();toast('Moneda cambiada a '+id+' (valores convertidos con tasa 1 USD = '+fmt(rate)+' CUP)');
  },
  editstore:()=>openSheet(`<h3>Datos de la tienda</h3><p class="muted">El nombre y la foto aparecen en tu pantalla de inicio y en Configuración.</p>
    <div class="photorow"><button class="photo" data-act="storephoto">${state.storeImg?`<img src="${state.storeImg}" alt="">`:`<div>${ic('camera')}<br>Foto</div>`}</button>
      <div><p>Agrega una foto para identificar tu tienda.</p>${state.storeImg?'<button class="lnk" data-act="rmstorephoto">Quitar foto</button>':''}</div></div>
    <div class="field"><label>Nombre de tu tienda</label><input class="inp" id="sn" value="${esc(state.store)}" autocomplete="off"></div>
    <button class="btn full" data-act="savestore">Guardar</button>`),
  savestore:()=>{const n=$('#sn').value.trim();if(!n)return toast('Escribe un nombre');state.store=n;save();renameActiveStore(n);closeSheet();render();syncStoreMeta()},
  switchstore:()=>{
    openSheet(`<h3>Tus tiendas</h3><p class="muted">Cambia entre tus tiendas o crea una nueva. Cada tienda guarda sus productos y ventas por separado en este teléfono, con su propio ID para vincular a Wallet.</p>
      ${registry.map(r=>`<button class="mrow" data-act="gostore" data-id="${r.id}">${ic('store')}<span>${esc(r.name)}</span>${r.id===activeId?ic('chev'):''}</button>`).join('')}
      <div class="field" style="margin-top:16px"><label>Nombre de la nueva tienda</label><input class="inp" id="newstorename" placeholder="Ej. Tienda 2" autocomplete="off"></div>
      <button class="btn full" data-act="donewstore">Crear nueva tienda</button>`)},
  gostore:id=>switchToStore(id),
  donewstore:()=>{const n=($('#newstorename')?.value||'').trim();if(!n)return toast('Escribe un nombre');createStore(n)},
  sharelist:async()=>{
    const avail=state.products.filter(p=>stock(p)>0);
    if(!avail.length)return toast('No hay productos disponibles para compartir');
    const hoy=new Date(),fecha=String(hoy.getDate()).padStart(2,'0')+'/'+String(hoy.getMonth()+1).padStart(2,'0')+'/'+hoy.getFullYear();
    let text=`${state.store}: Productos Disponibles\n`;
    avail.forEach(p=>{text+=`· ${p.name} – ${stock(p)} disp. – ${fmt(p.price)} ${state.cur}\n`});
    text+=`Actualizado: ${fecha}`;
    try{if(navigator.share){await navigator.share({text,title:state.store});return}}catch(e){}
    try{window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}catch(e){location.href='https://wa.me/?text='+encodeURIComponent(text)}
  },
  linkapprove:async id=>{
    const ok=await ensureAuth();if(!ok){toast('No se pudo conectar: '+authError);return}
    const {error}=await sb.from('store_links').update({status:'approved',decided_at:new Date().toISOString()}).eq('id',id);
    if(error){toast('No se pudo aprobar la solicitud');return}
    toast('Dispositivo vinculado a tu tienda');refreshLinks();
  },
  linkreject:async id=>{
    const ok=await ensureAuth();if(!ok){toast('No se pudo conectar: '+authError);return}
    const {error}=await sb.from('store_links').update({status:'rejected',decided_at:new Date().toISOString()}).eq('id',id);
    if(!error){toast('Solicitud rechazada');refreshLinks()}
  },
  linkrevoke:id=>ask('¿Revocar acceso?','Ese dispositivo dejará de ver la información de tu tienda en Wallet.','Revocar',async()=>{
    const ok=await ensureAuth();if(!ok){toast('No se pudo conectar: '+authError);return}
    const {error}=await sb.from('store_links').update({status:'revoked',decided_at:new Date().toISOString()}).eq('id',id);
    if(!error){toast('Acceso revocado');refreshLinks()}
  },true),
  export:()=>{const b=new Blob([JSON.stringify(state)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inventario-respaldo.json';document.body.appendChild(a);a.click();a.remove();toast('Respaldo exportado')},
  import:()=>$('#imp').click(),
  demo:()=>ask('Cargar datos de ejemplo','Esto reemplaza lo que tienes ahora por productos y ventas de prueba.','Cargar',()=>{demo();migrateLots();save();render();toast('Datos de ejemplo cargados')}),
  wipe:()=>ask('¿Borrar todo?','Se eliminarán productos, ventas y ajustes de este dispositivo. No se puede deshacer.','Borrar todo',()=>{const s=state.store;state=blank();state.store=s;state.onboarded=true;save();applyTheme();render();toast('Datos borrados')},true),
  confirm:()=>{closeSheet();confirmCb&&confirmCb()},
  sheetclose:()=>closeSheet(),
  start:()=>{state.store=$('#onbname').value.trim()||'Mi tienda';state.storeImg=onbImg;state.onboarded=true;save();renameActiveStore(state.store);$('#onb').classList.remove('on');render()},
  startdemo:()=>{state.store=$('#onbname').value.trim()||'Mi tienda';state.storeImg=onbImg;demo();migrateLots();state.onboarded=true;save();renameActiveStore(state.store);$('#onb').classList.remove('on');render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el.dataset.id,el)});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){ui.q=el.value;$('#grid').innerHTML=gridHTML();return}
  if(el.id==='saleq'){$('#salepick').innerHTML=salePickHTML(el.value);return}
  if(el.id==='sq'){ui.sq=el.value;const l=$('#saleslist');if(l)l.innerHTML=salesListHTML();return}
  if(el.id==='sdfrom'){ui.sFrom=el.value;const l=$('#saleslist');if(l)l.innerHTML=salesListHTML();return}
  if(el.id==='sdto'){ui.sTo=el.value;const l=$('#saleslist');if(l)l.innerHTML=salesListHTML();return}
  if(el.id==='es-q'||el.id==='es-p'||el.id==='es-c'){
    const q=Math.max(1,parseInt($('#es-q').value)||1),pr=num($('#es-p').value),c=num($('#es-c').value);
    const t=$('#es-tot');if(t)t.textContent=money(q*pr);
    const pf=$('#es-prof');if(pf){const prof=q*(pr-c);pf.textContent=sgn(prof)+' '+state.cur;pf.style.color=prof>=0?'var(--good)':'var(--bad)'}
    return;
  }
  if(!ov)return;const f=el.dataset.f;if(!f)return;
  if(ov.type==='form'){if(f==='v')draft.variants[+el.dataset.i][el.dataset.k]=el.value;else{draft[f]=el.value;if(f==='cost'||f==='price')margin()}}
  else if(ov.type==='detail'&&f==='price'){ov.price=el.value;sellDom()}
  else if(ov.type==='detail'&&f==='sdate'){ov.sdate=el.value}
});
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  openCrop(f);
});

/* ---------- sincronización con Supabase ---------- */
let linkRequests=null;
async function syncStoreMeta(){
  if(!sb||!state.storeId)return;
  const ok=await ensureAuth();if(!ok)return;
  try{await sb.from('stores').update({name:state.store,currency:state.cur}).eq('id',state.storeId)}catch(e){}
}
async function pullSale(externalId){
  if(!sb||!state.storeId)return;
  const ok=await ensureAuth();if(!ok)return;
  try{await sb.from('sales').delete().eq('store_id',state.storeId).eq('external_id',externalId)}catch(e){}
}
async function pushSale(s){
  if(!sb||!state.storeId)return;
  const ok=await ensureAuth();if(!ok)return;
  try{
    await sb.from('sales').insert({
      store_id:state.storeId,
      external_id:s.id,
      created_at:s.date,
      total:Math.round(s.qty*s.price*100)/100,
      payment_method:'Efectivo',
      items:[{name:s.name,variant:s.variant,qty:s.qty,price:s.price,cost:s.cost}]
    });
  }catch(e){}
}
async function loadLinks(){
  if(!sb||!state.storeId)return[];
  const ok=await ensureAuth();if(!ok)return[];
  const {data,error}=await sb.from('store_links').select('*').eq('store_id',state.storeId).order('created_at',{ascending:false});
  return error?[]:data;
}
async function refreshLinks(){
  if(!state.storeId||!sb)return;
  linkRequests=await loadLinks();
  const b=$('#linkbox');if(b&&ui.tab==='more')b.innerHTML=linkBoxHTML();
}
function linkBoxHTML(){
  if(!state.storeId)return'';
  if(!sb)return `<p class="muted" style="font-size:13px;margin-top:10px">Configura la conexión con la base de datos para ver aquí las solicitudes de Wallet.</p>`;
  if(linkRequests===null)return `<p class="muted" style="font-size:13px;margin-top:10px">Cargando solicitudes…</p>`;
  const pend=linkRequests.filter(l=>l.status==='pending'),appr=linkRequests.filter(l=>l.status==='approved');
  if(!pend.length&&!appr.length)return `<p class="muted" style="font-size:13px;margin-top:10px">Nadie ha pedido acceso a esta tienda todavía.</p>`;
  return (pend.length?`<div class="h4" style="margin:18px 0 10px">Solicitudes pendientes</div>${pend.map(l=>`
    <div class="row" style="align-items:flex-start">
      <div class="rm"><div class="rn">${esc(l.device_label||'Dispositivo')}</div>
        <div class="rs">Código: <b style="color:var(--ink)">${esc(l.code)}</b><br>Confírmalo contra el que ves en Wallet antes de aprobar.</div></div>
      <div class="rr" style="flex-direction:row;gap:8px">
        <button class="plus" style="background:var(--good)" data-act="linkapprove" data-id="${l.id}">${ic('plus')}</button>
        <button class="plus" style="background:var(--bad)" data-act="linkreject" data-id="${l.id}">${ic('trash')}</button>
      </div></div>`).join('')}`:'')
    +(appr.length?`<div class="h4" style="margin:18px 0 10px">Dispositivos vinculados</div>${appr.map(l=>`
    <div class="row"><div class="rm"><div class="rn">${esc(l.device_label||'Dispositivo')}</div><div class="rs">Con acceso a esta tienda en Wallet</div></div>
      <button class="lnk" style="color:var(--bad)" data-act="linkrevoke" data-id="${l.id}">Revocar</button></div>`).join('')}`:'');
}

/* ---------- recorte de foto ---------- */
let cropState=null,cropDrag=null,photoTarget=null,onbImg='';
function openCrop(file){
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const BOX=260,base=Math.max(BOX/img.naturalWidth,BOX/img.naturalHeight);
      cropState={img,BOX,base,zoom:1,tx:0,ty:0};
      $('#cropimg').src=fr.result;
      $('#cropzoomr').value=100;
      layoutCrop(true);
      $('#crop').classList.add('on');
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}
function layoutCrop(center){
  const cs=cropState;if(!cs)return;
  const s=cs.base*cs.zoom,w=cs.img.naturalWidth*s,h=cs.img.naturalHeight*s;
  if(center){cs.tx=(cs.BOX-w)/2;cs.ty=(cs.BOX-h)/2}
  else{cs.tx=Math.min(0,Math.max(cs.BOX-w,cs.tx));cs.ty=Math.min(0,Math.max(cs.BOX-h,cs.ty))}
  const im=$('#cropimg');im.style.width=w+'px';im.style.height=h+'px';im.style.transform=`translate(${cs.tx}px,${cs.ty}px)`;
}
(()=>{
  const cb=$('#cropbox');
  cb.addEventListener('pointerdown',e=>{if(!cropState)return;cropDrag={x:e.clientX,y:e.clientY,tx:cropState.tx,ty:cropState.ty};try{cb.setPointerCapture(e.pointerId)}catch(err){}});
  cb.addEventListener('pointermove',e=>{if(!cropDrag||!cropState)return;cropState.tx=cropDrag.tx+(e.clientX-cropDrag.x);cropState.ty=cropDrag.ty+(e.clientY-cropDrag.y);layoutCrop(false)});
  cb.addEventListener('pointerup',()=>cropDrag=null);
  cb.addEventListener('pointercancel',()=>cropDrag=null);
  $('#cropzoomr').addEventListener('input',e=>{if(!cropState)return;cropState.zoom=e.target.value/100;layoutCrop(false)});
})();
ACT.cropcancel=()=>{$('#crop').classList.remove('on');cropState=null;photoTarget=null};
ACT.cropok=()=>{
  const cs=cropState;if(!cs)return;
  const OUT=480,s=cs.base*cs.zoom,sx=-cs.tx/s,sy=-cs.ty/s,sw=cs.BOX/s,sh=cs.BOX/s;
  const c=document.createElement('canvas');c.width=OUT;c.height=OUT;
  c.getContext('2d').drawImage(cs.img,sx,sy,sw,sh,0,0,OUT,OUT);
  const url=c.toDataURL('image/jpeg',.84),t=photoTarget;
  $('#crop').classList.remove('on');cropState=null;photoTarget=null;
  if(t==='store'){state.storeImg=url;save();if($('#sh').classList.contains('on'))ACT.editstore();render()}
  else if(t==='onboard'){onbImg=url;updateOnbPhoto()}
  else{if(draft)draft.img=url;renderOv();margin()}
};
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='catsel'){ui.cat=el.value;render();return}
  if(el.matches&&el.matches('select[data-f="cat"]')&&draft){draft.cat=el.value}
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const fr=new FileReader();fr.onload=()=>{try{const s=JSON.parse(fr.result);if(!Array.isArray(s.products)||!Array.isArray(s.sales))throw 0;state=Object.assign(blank(),s,{onboarded:true});migrateLots();save();applyTheme();render();toast('Respaldo importado')}catch(err){toast('Ese archivo no es un respaldo válido')}};fr.readAsText(f);
});

/* ---------- bienvenida ---------- */
function showOnb(){
  $('#onb').innerHTML=`<div class="onbtop"><span class="f" style="top:12%;left:10%">👕</span><span class="f" style="top:16%;right:10%;animation-delay:-1.5s">👟</span><span class="f" style="bottom:12%;left:14%;animation-delay:-3s">🎧</span><span class="f" style="bottom:16%;right:12%;animation-delay:-2s">💄</span><span class="big">🛍️</span></div>
    <div class="onbbot"><div class="dots"><i></i><i></i><i></i></div><h2>Controla tu inventario y tus ganancias</h2>
    <p>Registra lo que compras, lo que vendes y cuánto dinero llevas ganado, todo desde tu teléfono.</p>
    <button class="onbphoto" id="onbphoto" data-act="onbphoto">${onbImg?`<img src="${onbImg}" alt="">`:ic('camera')}</button>
    <input id="onbname" placeholder="Nombre de tu tienda" autocomplete="off"><button class="pill full" data-act="start">Continuar</button>
    <button class="lnk" data-act="startdemo">Probar con datos de ejemplo</button></div>`;
  $('#onb').classList.add('on');
}
function updateOnbPhoto(){const b=$('#onbphoto');if(b){b.innerHTML=onbImg?`<img src="${onbImg}" alt="">`:ic('camera');b.classList.toggle('has',!!onbImg)}}

/* ---------- botón atrás de Android: navega entre pantallas, no cierra la app ---------- */
function handleBack(){
  if($('#lb').classList.contains('on')){ACT.closelb();return}
  if($('#crop').classList.contains('on')){ACT.cropcancel();return}
  if($('#sh').classList.contains('on')){closeSheet();return}
  if($('#onb').classList.contains('on'))return;
  if(ov){closeOv();return}
  if(ui.tab!=='home'){ui.tab='home';render();$('#view').scrollTop=0;return}
  /* ya estamos en Inicio y no hay nada más abierto: no cerramos la app */
}
try{
  if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App){
    window.Capacitor.Plugins.App.addListener('backButton',handleBack);
  }else{
    document.addEventListener('backbutton',handleBack,false);
  }
}catch(e){}

applyTheme();render();
if(!state.onboarded)showOnb();
if(sb)ensureAuth();
setTimeout(()=>checkUpdate(true),2500);
})();
</script>
