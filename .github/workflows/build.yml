name: Build APK
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Instalar dependencias
        run: npm install
 
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Agregar la plataforma Android
        run: npx cap add android
 
      - name: Sincronizar Capacitor
        run: npx cap sync android

      # Actualizador interno: descarga el APK nuevo dentro de la app y abre el
      # instalador de Android sin pasar por el navegador (código en native/).
      - name: Agregar el actualizador interno
        run: |
          set -e
          PKG=android/app/src/main/java/com/tienda/inventario
          test -d "$PKG"
          cp native/ApkUpdaterPlugin.java native/UpdateFileProvider.java native/MainActivity.java "$PKG/"
          mkdir -p android/app/src/main/res/xml
          cp native/update_paths.xml android/app/src/main/res/xml/update_paths.xml
          python3 scripts/add_updater.py android/app/src/main/AndroidManifest.xml

      # La versión es la misma en la app y en Releases. Sale de package.json:
      # si ahí dice 1.1.0, esta compilación es 1.1.0 y cada push siguiente
      # suma 1 al último número (1.1.1, 1.1.2...). Al cambiar la versión en
      # package.json (por ejemplo a 1.2.0) la cuenta empieza de nuevo desde ahí.
      - name: Poner la versión real en el APK
        run: |
          BASE=$(node -p "require('./package.json').version")
          DESDE=$(git log -1 --format=%H -G'"version"' -- package.json)
          N=$( [ -n "$DESDE" ] && git rev-list --count "$DESDE"..HEAD || echo 0 )
          VER=$(node -p "const v='$BASE'.split('.').map(Number);v[2]=(v[2]||0)+$N;v.join('.')")
          echo "VER=$VER" >> $GITHUB_ENV
          echo "Versión: $VER"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          # La app muestra su versión en Configuración y la compara con Releases
          F=android/app/src/main/assets/public/index.html
          sed -i "s/const APP_VERSION='dev'/const APP_VERSION='$VER'/" $F
          grep -q "const APP_VERSION='$VER'" $F

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x android/gradlew
 
      - name: Compilar el APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      # Siempre la misma firma (keystore/release.keystore): así cada APK nuevo
      # se instala encima del anterior sin borrar tus datos. Antes se usaba la
      # firma de depuración, que GitHub genera nueva en cada compilación y por
      # eso Android decía que había "conflicto con un paquete existente".
      - name: Firmar el APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alineado.apk
          $BT/apksigner sign --ks keystore/release.keystore --ks-pass pass:'Tnda#Inv730dcde4' \
            --ks-key-alias tiendaapp --key-pass pass:'Tnda#Inv730dcde4' \
            --out Inventario.apk alineado.apk
          $BT/apksigner verify Inventario.apk
 
      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: inventario-apk
          path: Inventario.apk
 
      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Inventario v${{ env.VER }}
          files: Inventario.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
